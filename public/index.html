<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大作业提交系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      background-image: url('/digimon.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(13, 71, 161, 0.55);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.3s;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #1976d2;
    }
    .file-upload {
      position: relative;
      border: 2px dashed #d0d0d0;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
    }
    .file-upload:hover {
      border-color: #1976d2;
      background: #e3f2fd;
    }
    .file-upload.has-file {
      border-color: #4caf50;
      background: #f1f8f1;
    }
    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .file-upload .text {
      color: #888;
      font-size: 14px;
    }
    .file-upload .filename {
      color: #4caf50;
      font-weight: 500;
      margin-top: 8px;
      font-size: 14px;
      word-break: break-all;
    }
    .hint {
      color: #aaa;
      font-size: 12px;
      margin-top: 6px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.1s;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .message.error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
    .progress-bar {
      margin-top: 12px;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress-bar .progress {
      height: 100%;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>大作业提交系统</h1>
    <p class="subtitle">请填写信息并上传压缩包文件</p>
    <form id="submitForm">
      <div class="form-group">
        <label for="className">班级</label>
        <input type="text" id="className" name="className" placeholder="例如：计算机2301班" required>
      </div>
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" placeholder="请输入姓名" required>
      </div>
      <div class="form-group">
        <label for="studentId">学号</label>
        <input type="text" id="studentId" name="studentId" placeholder="请输入学号" required>
      </div>
      <div class="form-group">
        <label>压缩包文件</label>
        <div class="file-upload" id="fileUpload">
          <input type="file" id="file" name="file" accept=".zip,.rar,.7z,.tar,.gz,.tar.gz" required>
          <div class="icon">📁</div>
          <div class="text">点击或拖拽文件到此处上传</div>
          <div class="filename" id="fileName"></div>
        </div>
        <div class="hint">支持 zip、rar、7z、tar、gz 格式，最大 500MB</div>
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit">提交</button>
      <div class="progress-bar" id="progressBar"><div class="progress" id="progress"></div></div>
      <div class="message" id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('submitForm');
    const fileInput = document.getElementById('file');
    const fileUpload = document.getElementById('fileUpload');
    const fileName = document.getElementById('fileName');
    const btnSubmit = document.getElementById('btnSubmit');
    const message = document.getElementById('message');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
        fileUpload.classList.add('has-file');
      } else {
        fileName.textContent = '';
        fileUpload.classList.remove('has-file');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'message';
      message.textContent = '';

      const formData = new FormData(form);

      btnSubmit.disabled = true;
      btnSubmit.textContent = '提交中...';
      progressBar.style.display = 'block';
      progress.style.width = '0%';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/submit');

      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progress.style.width = pct + '%';
        }
      });

      xhr.addEventListener('load', () => {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '提交';
        progressBar.style.display = 'none';
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success) {
            message.className = 'message success';
            message.textContent = res.message;
            form.reset();
            fileName.textContent = '';
            fileUpload.classList.remove('has-file');
          } else {
            message.className = 'message error';
            message.textContent = res.message;
          }
        } catch {
          message.className = 'message error';
          message.textContent = '提交失败，请重试';
        }
      });

      xhr.addEventListener('error', () => {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '提交';
        progressBar.style.display = 'none';
        message.className = 'message error';
        message.textContent = '网络错误，请重试';
      });

      xhr.send(formData);
    });
  </script>
</body>
</html>
