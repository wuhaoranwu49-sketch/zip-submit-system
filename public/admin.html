<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交管理 - 大作业提交系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      color: #fff;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 22px; }
    .header a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.8;
    }
    .header a:hover { opacity: 1; }
    .toolbar {
      background: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 8px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .toolbar input:focus, .toolbar select:focus {
      border-color: #1976d2;
    }
    .stats {
      margin-left: auto;
      color: #888;
      font-size: 14px;
    }
    .content {
      padding: 24px 32px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    th {
      background: #fafafa;
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: #555;
      font-size: 14px;
      border-bottom: 2px solid #eee;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #333;
    }
    tr:hover td { background: #e3f2fd; }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    .btn-download {
      background: #e3f2fd;
      color: #1565c0;
    }
    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 16px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: #e8f5e9;
      color: #2e7d32;
    }
    @media (max-width: 768px) {
      .header, .toolbar, .content { padding: 16px; }
      table { font-size: 13px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>提交管理</h1>
    <a href="/">返回提交页面</a>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索姓名/学号...">
    <select id="classFilter">
      <option value="">全部班级</option>
    </select>
    <div class="stats" id="stats"></div>
  </div>
  <div class="content">
    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>班级</th>
          <th>姓名</th>
          <th>学号</th>
          <th>文件名</th>
          <th>文件大小</th>
          <th>提交时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">暂无提交记录</div>
  </div>

  <script>
    let allData = [];

    async function loadData() {
      const res = await fetch('/api/submissions');
      allData = await res.json();
      updateClassFilter();
      render();
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function updateClassFilter() {
      const classes = [...new Set(allData.map(s => s.className))];
      const select = document.getElementById('classFilter');
      const current = select.value;
      select.innerHTML = '<option value="">全部班级</option>';
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      select.value = current;
    }

    function getFiltered() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const cls = document.getElementById('classFilter').value;
      return allData.filter(s => {
        const matchSearch = !search || s.name.toLowerCase().includes(search) || s.studentId.includes(search);
        const matchClass = !cls || s.className === cls;
        return matchSearch && matchClass;
      });
    }

    function render() {
      const filtered = getFiltered();
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      const stats = document.getElementById('stats');

      stats.textContent = `共 ${allData.length} 条记录，当前显示 ${filtered.length} 条`;

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = filtered.map((s, i) => {
        const origIndex = allData.indexOf(s);
        return `<tr>
          <td>${i + 1}</td>
          <td><span class="badge">${s.className}</span></td>
          <td>${s.name}</td>
          <td>${s.studentId}</td>
          <td>${s.fileName}</td>
          <td>${formatSize(s.fileSize)}</td>
          <td>${s.submitTime}</td>
          <td>
            <button class="btn btn-download" onclick="download('${s.savedName}')">下载</button>
            <button class="btn btn-delete" onclick="del(${origIndex})">删除</button>
          </td>
        </tr>`;
      }).join('');
    }

    function download(filename) {
      window.open('/api/download/' + encodeURIComponent(filename));
    }

    async function del(index) {
      if (!confirm('确定删除该提交记录？文件也将被删除。')) return;
      const res = await fetch(`/api/submissions/${index}`, { method: 'DELETE' });
      if (res.ok) {
        await loadData();
      } else {
        alert('删除失败');
      }
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('classFilter').addEventListener('change', render);

    loadData();
  </script>
</body>
</html>
